<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Cinzel;src:url(fonts/Cinzel.ttf)}body{margin:0}</style></head><body><canvas id=c width=1920 height=1080></canvas>
<script src="lib.js"></script><script>
const c=document.getElementById('c').getContext('2d');
function big(s,x,y,size,fill,stroke,sw,opt={}){c.save();c.setTransform(1,0,0,1,0,0);c.font=`900 ${size}px Cinzel`;c.textAlign=opt.align||'left';c.textBaseline='alphabetic';c.letterSpacing=(opt.ls||0)+'px';
 c.lineJoin='round';c.shadowColor='rgba(0,0,0,0.9)';c.shadowBlur=30;c.shadowOffsetY=10;c.strokeStyle=stroke;c.lineWidth=sw;c.strokeText(s,x,y);c.shadowColor='transparent';
 if(fill==='gold'){const g=c.createLinearGradient(0,y-size*0.8,0,y);g.addColorStop(0,'#fff6c8');g.addColorStop(0.45,'#f2b934');g.addColorStop(1,'#a8650c');c.fillStyle=g}else c.fillStyle=fill;
 c.fillText(s,x,y);c.restore();}
window.draw=function(variant){
 c.setTransform(1,0,0,1,0,0);
 sky(c,[[0,'#120608'],[0.35,'#5a1410'],[0.55,'#d2541c'],[0.66,'#ffb04a'],[1,'#1a0a06']]);
 // sun burst behind spartan
 c.save();c.globalAlpha=0.22;c.fillStyle='#ffcf7a';for(let i=0;i<22;i++){const a=i/22*Math.PI*2;c.beginPath();c.moveTo(560,640);c.lineTo(560+Math.cos(a)*2200,640+Math.sin(a)*2200);c.lineTo(560+Math.cos(a+0.08)*2200,640+Math.sin(a+0.08)*2200);c.fill();}c.restore();
 sun(c,560,640,90,'#fff4cf','rgba(255,150,50,0.7)');
 // ghost Xerxes in the sky (variant A)
 if(variant==='A'){c.save();c.globalAlpha=0.85;c.translate(1770,250);c.scale(105,105);
   const g=c.createRadialGradient(0,0,0.2,0,0,1.6);g.addColorStop(0,'rgba(20,0,0,0.95)');g.addColorStop(1,'rgba(20,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,1.6,0,7);c.fill();
   c.fillStyle='#000';c.beginPath();c.arc(0,0,1,0,7);c.fill();headgear(c,'xerxes',{},0);c.restore();
   c.save();c.translate(1770,250);c.scale(-105,105);c.shadowColor='#ff2a10';c.shadowBlur=40;c.fillStyle='#ff4a2a';
   eye(c,-0.35,0.05,0.26,0.2,0.55,-0.15);eye(c,0.35,0.05,0.26,0.2,-0.15,0.55);c.restore();}
 // mountains
 ridge(c,301,-100,2100,690,150,0.003,'rgba(60,20,18,0.95)',true);
 c.fillStyle='#2a0f0a';c.fillRect(0,688,1920,400);
 // persian army sea on the right
 armyMass(c,61,700,2000,690,760,0,'#200b07','rgba(255,200,150,0.7)',{n:4000});
 const rows=buildCrowd('th'+variant,{seed:91,horizon:690,depth:420,k:12,x0:820,x1:2000,zNear:1.0,zFar:6,spacing:2.8,rowStep:0.06});
 drawCrowd(c,rows,0,{rise:1,fog:'rgba(150,50,25,0.85)'});
 for(let b=0;b<5;b++)banner(c,950+b*210,770+(b%2)*40,200,b%2?P.red:P.gold,b*1.3,b);
 haze(c,640,800,'rgba(255,120,50,0.35)');
 embers(c,7,120,3.3,1);
 // rim glow + Leonidas
 glow(c,520,560,520,'rgba(255,90,30,0.45)');
 c.save();c.shadowColor='rgba(255,140,60,0.9)';c.shadowBlur=40;
 fig(c,{x:500,y:1310,s:118,kind:'spartan',mood:'angry',t:0.6,wind:2.2,spearTilt:0.08});c.restore();
 // eye glow
 c.save();c.globalCompositeOperation='lighter';glow(c,598,494,70,'rgba(255,220,160,0.5)');glow(c,666,492,60,'rgba(255,220,160,0.45)');c.restore();
 // dark vignette
 const v=c.createRadialGradient(960,540,400,960,540,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.7)');c.fillStyle=v;c.fillRect(0,0,1920,1080);
 // text
 if(variant==='A'){
  big('300',1010,300,250,'gold','#1a0500',26);
  big('VS',1500,300,110,'#ff3b1f','#1a0500',18);
  big('EMPIRE',1000,500,200,'#fff7ea','#1a0500',26,{ls:4});
  c.save();c.fillStyle='#c4190c';c.fillRect(1010,535,860,64);c.restore();
  big('THE BATTLE OF THERMOPYLAE',1440,584,40,'#fff2d0','#1a0500',0.1,{align:'center',ls:3});
 } else {
  big('THEY',1050,260,170,'#fff7ea','#1a0500',22);
  big('STAYED.',1010,450,210,'gold','#1a0500',26);
  c.save();c.fillStyle='#c4190c';c.fillRect(1020,490,780,64);c.restore();
  big('300 SPARTANS vs PERSIA',1410,539,40,'#fff2d0','#1a0500',0.1,{align:'center',ls:3});
 }
 // channel badge
 c.save();c.globalAlpha=0.95;c.fillStyle='rgba(0,0,0,0.55)';c.beginPath();c.roundRect(40,40,430,70,35);c.fill();c.restore();
 big('STICKMAN HISTORY',255,90,34,'gold','#000',0.1,{align:'center',ls:3});
};
</script></body></html>
